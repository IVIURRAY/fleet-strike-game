name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build all workspaces
        run: pnpm build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: '**/coverage/**'
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f infrastructure/docker/Dockerfile.backend -t fleet-strike-backend:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -f infrastructure/docker/Dockerfile.frontend -t fleet-strike-frontend:${{ github.sha }} .

      - name: Smoke test the backend image
        run: |
          docker run -d --name fs-backend -p 3000:3000 fleet-strike-backend:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              echo "backend healthy"
              docker rm -f fs-backend
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          docker logs fs-backend
          docker rm -f fs-backend
          exit 1
